<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>院内帳票｜勾当台夕方内科クリニック</title>
  <!--
    院内専用の帳票一覧。Worker（backend/src/internal-forms.ts）がパスワード認証の後に配信する。
    帳票を追加したら、このディレクトリに HTML を置き、下の一覧に1行足す。
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: #f1f5f9;
      color: #111;
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #2c5f7c;
      color: white;
    }
    header h1 { font-size: 1rem; }
    header a { color: white; font-size: 0.85rem; }
    main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
    ul { list-style: none; display: grid; gap: 12px; }
    li a {
      display: block;
      padding: 16px 20px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }
    li a:hover { border-color: #2c5f7c; }
    li strong { display: block; font-size: 1rem; }
    li span { font-size: 0.85rem; color: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>勾当台夕方内科クリニック　院内帳票</h1>
    <a href="/logout">ログアウト</a>
  </header>
  <main>
    <ul>
      <li>
        <a href="/kansensho-rikan-shomeisho">
          <strong>感染症罹患証明書</strong>
          <span>インフルエンザ／新型コロナ共通・A4 1枚</span>
        </a>
      </li>
      <li>
        <a href="/genryo-seikatsu-plan">
          <strong>減量のための生活プラン</strong>
          <span>肥満症の生活療養指導用紙・A4 3ページ（身長・体重から自動計算）</span>
        </a>
      </li>
      <li>
        <a href="/ryoshusho">
          <strong>領収書（自費・予防接種など）</strong>
          <span>会社名宛てなどレセコン以外で出す領収書・A5 1枚（宛名・金額を入力、日付は自動）</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
