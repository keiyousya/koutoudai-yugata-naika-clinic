<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>インフルエンザ予防接種 広告 - 勾当台夕方内科クリニック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /*
    Instagram広告用（インフルエンザ予防接種）
    - .post.feed  : フィード 4:5（1080×1350）
    - .post.story : ストーリーズ・リール 9:16（1080×1920）
      Metaのセーフゾーン（上14%=269px・下35%=672px・左右6%=65px）に文字を置かない
    配色はHP（frontend/src/layouts/Layout.astro の --color-*）に合わせる
    書き出しは各 .post 要素をスクリーンショットする
  */
  :root {
    --navy: #1e3a5f;
    --coral: #f08c5a;
    --coral-bg: #fff5eb;
    --turquoise: #3eb8c8;
    --turquoise-bg: #e8f6f8;
    --yellow: #FBC96B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 80px;
    padding: 80px 0;
    background: #2c2c2c;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--navy);
  }

  .post {
    width: 1080px;
    position: relative;
    overflow: hidden;
    background: var(--coral-bg);
    font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
  }
  .post.feed { height: 1350px; }
  .post.story { height: 1920px; }

  /* 背景の飾り */
  .deco { position: absolute; border-radius: 50%; pointer-events: none; }
  .deco.sun { width: 520px; height: 520px; background: var(--yellow); opacity: 0.45; top: -200px; right: -160px; }
  .deco.mint { width: 620px; height: 620px; background: var(--turquoise-bg); bottom: -260px; left: -220px; }
  .deco.dot { background: var(--coral); opacity: 0.35; }
  .deco.dot.t { background: var(--turquoise); }
  .deco.dot.y { background: var(--yellow); opacity: 0.9; }
  .sparkle { position: absolute; pointer-events: none; }

  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 64px 48px;
  }

  /* ヘッダー */
  .head {
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 64px; height: 64px; }
  .brand span { font-size: 30px; font-weight: 800; letter-spacing: 0.04em; }
  .station {
    background: #fff;
    border: 3px solid var(--navy);
    border-radius: 999px;
    padding: 6px 22px;
    font-size: 24px;
    font-weight: 800;
  }


  /* 見出し */
  .title { margin-top: 44px; text-align: center; position: relative; }
  .title .lead {
    display: inline-block;
    font-size: 68px;
    font-weight: 900;
    color: var(--coral);
    letter-spacing: 0.06em;
    transform: rotate(-3deg);
  }
  .title h1 {
    margin-top: 4px;
    font-size: 102px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 0.02em;
  }
  .title h1 .marker {
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
    padding: 0 6px;
  }

  /* 主役：平日19時・土日 */
  .times {
    display: flex;
    justify-content: center;
    gap: 36px;
    margin-top: 28px;
  }
  .time {
    width: 440px;
    height: 440px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 14px 0 rgba(30, 58, 95, 0.14);
    position: relative;
  }
  .time.weekday { background: var(--coral); transform: rotate(-4deg); }
  .time.weekend { background: var(--turquoise); transform: rotate(4deg); }
  .time .icon { width: 64px; height: 64px; margin-bottom: 4px; }
  .time .day {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 0.12em;
    background: #fff;
    border-radius: 999px;
    padding: 0 26px;
    line-height: 1.5;
  }
  .time.weekday .day { color: var(--coral); }
  .time.weekend .day { color: var(--turquoise); }
  .time .big {
    margin-top: 8px;
    font-size: 150px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .time .big small { font-size: 64px; letter-spacing: 0; }
  .time .sub { margin-top: 10px; font-size: 30px; font-weight: 800; }

  /* サブの売り */
  .points {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }
  .point {
    background: #fff;
    border: 3px solid var(--navy);
    border-radius: 20px;
    padding: 12px 24px;
    font-size: 32px;
    font-weight: 900;
    white-space: nowrap;
  }
  .point em { font-style: normal; color: var(--coral); }

  /* 下部 */
  .bottom { margin-top: auto; padding-top: 12px; text-align: center; }
  .price { font-size: 36px; font-weight: 800; }
  .price strong { font-size: 76px; font-weight: 900; color: var(--coral); }
  .price .small { font-size: 28px; font-weight: 700; opacity: 0.75; }
  .access { margin-top: 12px; font-size: 40px; font-weight: 800; }

  /* Story/Reels：上14%・左右6%は空ける。札・料金・アクセス（〜y=1525）はリールの下35%にかかるが、見やすさを優先して許容 */
  .story .content { padding: 272px 65px 0; height: 1248px; }
  .story .head { justify-content: center; gap: 16px; }
  .story .brand { gap: 12px; }
  .story .brand svg { width: 88px; height: 88px; }
  .story .brand span { font-size: 39px; letter-spacing: 0.02em; }
  .story .station { font-size: 29px; padding: 6px 20px; }
  .story .title { margin-top: 42px; }
  .story .title .lead { font-size: 70px; line-height: 1.02; }
  .story .title h1 { margin-top: 6px; font-size: 106px; line-height: 1.08; }
  .story .times { margin-top: 42px; gap: 30px; }
  .story .time { width: 450px; height: 450px; }
  .story .time .icon { width: 72px; height: 72px; }
  .story .time .day { font-size: 52px; }
  .story .time .big { font-size: 164px; }
  .story .time .big small { font-size: 70px; }
  .story .time .sub { font-size: 34px; }
  .story .points { margin-top: 42px; gap: 18px; }
  .story .point { font-size: 38px; padding: 12px 26px; }
  /* 予約は広告のボタンに任せ、料金とアクセスを札の下に出す */
  .story .bottom { margin-top: 30px; padding-top: 0; }
  .story .price { font-size: 36px; }
  .story .price strong { font-size: 68px; }
  .story .price .small { font-size: 28px; }
  .story .access { margin-top: 10px; font-size: 38px; }
  .story .deco.mint { width: 900px; height: 900px; bottom: -420px; left: -160px; }
  /* 下35%は文字を置かず、HPロゴのビル街モチーフで埋める */
  .town { position: absolute; left: 0; bottom: -70px; }
  .moon { position: absolute; top: 1545px; right: 110px; width: 110px; height: 110px; }
</style>
</head>
