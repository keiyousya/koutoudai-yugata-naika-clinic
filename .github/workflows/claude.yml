# Issue・PR のコメントや Issue 本文の「@claude」で Claude Code が動き、ブランチを切って作業し、PR を作る。
# AI秘書（keiyousya/agent-secretary の github_ask_claude）や田村個人が書いた依頼に応える。
# 書き込み権限のある人の依頼にだけ応じる（claude-code-action の既定）。
#
# Claude のサブスクリプション（Max プラン）で動かす。`claude setup-token` で作ったトークンを Secrets の CLAUDE_CODE_OAUTH_TOKEN に入れる。
# 公開リポジトリなので Actions のログは誰でも見られる。show_full_output は有効にしない。
#
# 資料だけの PR は claude-automerge.yml が自動でマージする。それ以外は田村個人が確認してからマージする。

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-action が Claude の GitHub App のトークンを OIDC で取得する
      id-token: write
      actions: read
    steps:
      # claude-code-action はチェックアウトした認証情報でブランチを取得・push する
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(pnpm install:*),Bash(pnpm --filter:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "作業でファイルを変えたら、push した後に gh pr create で main への PR を作る（タイトル・本文は日本語、コミットメッセージはこのリポジトリの git log の形式に合わせる）。PR の URL を最後の返信に書く。"
