<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本日の診療開始時刻 - 入口掲示用</title>
  <style>
    @page {
      size: A5 landscape;
      margin: 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: white;
      color: #1e3a5f;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* A5横の両面印刷で表=14時版・裏=17時版（ラミネートして日によって裏返す） */
    .sheet {
      width: 210mm;
      height: 148mm;
      padding: 8mm;
      overflow: hidden;
      page-break-after: always;
    }

    .sheet:last-of-type {
      page-break-after: auto;
    }

    /* 枠は border で描くと印刷で細くなるので、紺の板に白い板を重ねて塗りで出す */
    .frame {
      height: 100%;
      padding: 4mm;
      background: #1e3a5f;
      border-radius: 6mm;
    }

    .inner {
      height: 100%;
      background: white;
      border-radius: 3mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2mm;
      text-align: center;
    }

    .lead {
      font-size: 32pt;
      font-weight: 900;
      line-height: 1.2;
    }

    .time {
      font-size: 104pt;
      font-weight: 900;
      line-height: 1.05;
      color: #c0392b;
      letter-spacing: 0.02em;
    }

    .time small {
      font-size: 48pt;
      color: #1e3a5f;
      margin-left: 3mm;
    }

    .sub {
      margin-top: 2mm;
      padding-top: 4mm;
      border-top: 0.7mm solid #c8d3df;
      font-size: 21pt;
      font-weight: bold;
      line-height: 1.5;
    }

    .note {
      font-size: 14pt;
      font-weight: bold;
      color: #4a5f78;
    }

    .print-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    @media print {
      .print-button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="frame">
      <div class="inner">
        <p class="lead">本日は</p>
        <p class="time">14:00<small>から</small></p>
        <p class="lead">診療開始です</p>
        <p class="sub">院内へは 14:00 からお入りいただけます</p>
        <p class="note">準備中のため、恐れ入りますがそれまでお待ちください</p>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="frame">
      <div class="inner">
        <p class="lead">本日は</p>
        <p class="time">17:00<small>から</small></p>
        <p class="lead">診療開始です</p>
        <p class="sub">院内へは 17:00 からお入りいただけます</p>
        <p class="note">準備中のため、恐れ入りますがそれまでお待ちください</p>
      </div>
    </div>
  </div>

  <button class="print-button" onclick="window.print()">印刷する</button>
</body>
</html>
