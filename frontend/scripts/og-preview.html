<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OG Image Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 40px; background: #eee; }
  .og-container {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  /* Top/bottom accent bars */
  .bar-top { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #3eb8c8; z-index: 3; }
  .bar-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #f08c5a; z-index: 3; }

  /* Photo - full background */
  .photo-area {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Overlay for text readability */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,0.92) 0%,
      rgba(255,255,255,0.8) 45%,
      rgba(255,255,255,0.3) 70%,
      rgba(255,255,255,0.1) 100%
    );
    z-index: 1;
  }

  /* Content */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-top: 120px;
    height: 100%;
    padding-left: 80px;
  }

  .header { display: flex; align-items: center; gap: 20px; }
  .logo { width: 100px; height: 100px; }
  .clinic-name { font-family: 'Noto Sans JP', sans-serif; font-size: 42px; font-weight: 700; color: #1e3a5f; letter-spacing: 3px; }

  .catchphrase {
    font-family: 'M PLUS 1p', sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: #555;
    letter-spacing: 2px;
    margin-top: 24px;
  }
</style>
</head>
